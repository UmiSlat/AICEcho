name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AIMESIM_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
      AIMESIM_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      AIMESIM_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate tag and signing configuration
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          version_name=$(awk -F "'" '/^[[:space:]]*versionName[[:space:]]*=/{print $2; exit}' app/build.gradle)
          test -n "$version_name"
          test "$GITHUB_REF_NAME" = "v${version_name}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${version_name}." >&2
            exit 1
          }
          test -n "$ANDROID_SIGNING_KEY"
          test -n "$AIMESIM_RELEASE_STORE_PASSWORD"
          test -n "$AIMESIM_RELEASE_KEY_ALIAS"
          test -n "$AIMESIM_RELEASE_KEY_PASSWORD"
          release_keystore="$RUNNER_TEMP/aimesimulator-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$release_keystore"
          test -s "$release_keystore"
          echo "AIMESIM_RELEASE_KEYSTORE=$release_keystore" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android build packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"

      - name: Test and build signed APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      - name: Package and verify project artifacts
        run: |
          python3 tools/package_module.py
          python3 tools/check_artifacts.py

      - name: Verify and stage release APK
        run: |
          version_name=${GITHUB_REF_NAME#v}
          release_apk="dist/AimeSimulator-${version_name}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$release_apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$release_apk"
          cd dist
          sha256sum "$(basename "$release_apk")" > "$(basename "$release_apk").sha256"

      - name: Upload signed APK to workflow run
        uses: actions/upload-artifact@v6
        with:
          name: AimeSimulator-${{ github.ref_name }}-release
          path: |
            dist/AimeSimulator-*-release.apk
            dist/AimeSimulator-*-release.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=${GITHUB_REF_NAME#v}
          release_apk="dist/AimeSimulator-${version_name}-release.apk"
          checksum="${release_apk}.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$release_apk" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$release_apk" "$checksum" \
              --verify-tag \
              --generate-notes \
              --title "AimeSimulator ${version_name}"
          fi
