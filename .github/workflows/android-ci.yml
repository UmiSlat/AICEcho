name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNED_MAIN_BUILD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Identify CI build
        id: build
        run: |
          short_sha=${GITHUB_SHA::7}
          echo "version_suffix=-ci.${GITHUB_RUN_NUMBER}.${short_sha}" >> "$GITHUB_OUTPUT"
          if [ "$SIGNED_MAIN_BUILD" = "true" ]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test diagnostic tools
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s tools/hcef-lab/test -p 'test_*.py'
          node --test --test-timeout=15000 tools/hinata-diagnostics/*.test.mjs

      - name: Install Android build packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"

      - name: Test and build debug APK
        env:
          CI_VERSION_SUFFIX: ${{ steps.build.outputs.version_suffix }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug "-PciVersionSuffix=$CI_VERSION_SUFFIX" --stacktrace

      - name: Prepare main signing key
        if: env.SIGNED_MAIN_BUILD == 'true'
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          test -n "$ANDROID_SIGNING_KEY"
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/aicecho-ci-release.jks"
          test -s "$RUNNER_TEMP/aicecho-ci-release.jks"

      - name: Build signed main APK
        if: env.SIGNED_MAIN_BUILD == 'true'
        env:
          AICECHO_RELEASE_KEYSTORE: ${{ runner.temp }}/aicecho-ci-release.jks
          AICECHO_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          AICECHO_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AICECHO_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CI_VERSION_SUFFIX: ${{ steps.build.outputs.version_suffix }}
        run: |
          test -n "$AICECHO_RELEASE_STORE_PASSWORD"
          test -n "$AICECHO_RELEASE_KEY_ALIAS"
          test -n "$AICECHO_RELEASE_KEY_PASSWORD"
          ./gradlew lintRelease assembleRelease "-PciVersionSuffix=$CI_VERSION_SUFFIX" --stacktrace

      - name: Remove temporary signing key
        if: always() && env.SIGNED_MAIN_BUILD == 'true'
        run: rm -f "$RUNNER_TEMP/aicecho-ci-release.jks"

      - name: Package and verify artifacts
        run: |
          python3 tools/package_module.py
          python3 tools/check_artifacts.py

      - name: Prepare CI artifact
        env:
          APK_VARIANT: ${{ steps.build.outputs.variant }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          variant = os.environ["APK_VARIANT"]
          source = Path("app/build/outputs/apk") / variant
          metadata = json.loads((source / "output-metadata.json").read_text())
          [element] = metadata["elements"]
          destination = Path("dist/ci")
          destination.mkdir(parents=True, exist_ok=True)
          name = f"AICEcho-{element['versionName']}-{variant}.apk"
          apk = destination / name
          shutil.copyfile(source / element["outputFile"], apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          module = destination / "aicecho-pmm-ksu-v3.zip"
          shutil.copyfile(Path("dist") / module.name, module)
          module_digest = hashlib.sha256(module.read_bytes()).hexdigest()
          (destination / "SHA256SUMS.txt").write_text(
              f"{digest}  {name}\n{module_digest}  {module.name}\n")
          info = {
              "versionName": element["versionName"],
              "versionCode": element["versionCode"],
              "applicationId": metadata["applicationId"],
              "variant": variant,
              "signing": "release" if variant == "release" else "temporary-debug",
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "runUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha256": digest,
              "module": {"file": module.name, "id": "aicecho_pmm", "sha256": module_digest},
          }
          (destination / "build-info.json").write_text(json.dumps(info, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### {name}\n\nVersion code: {element['versionCode']}\n\n")
              summary.write(f"Commit: `{info['commit']}`\n\nSHA-256: `{digest}`\n\n")
              summary.write("Download the APK and verification files from this run's Artifacts. This CI build does not create a GitHub Release.\n")
          PY
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs dist/ci/*.apk > dist/ci/SIGNATURE.txt
          cat dist/ci/SIGNATURE.txt

      - name: Upload CI APK
        uses: actions/upload-artifact@v6
        with:
          name: AICEcho-${{ steps.build.outputs.variant }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/ci/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AICEcho-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
