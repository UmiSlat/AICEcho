plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystoreFile = System.getenv('AICECHO_RELEASE_KEYSTORE')
def releaseKeystorePassword = System.getenv('AICECHO_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('AICECHO_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('AICECHO_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [
    releaseKeystoreFile,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.isBlank() }

android {
    namespace = 'io.github.umislat.aicecho'
    compileSdk = 36
    buildToolsVersion = '36.1.0'
    ndkVersion = '25.1.8937393'

    defaultConfig {
        applicationId = 'io.github.umislat.aicecho'
        minSdk = 29
        targetSdk = 36
        versionCode = 51
        versionName = '3.0.1'
        versionNameSuffix = providers.gradleProperty('ciVersionSuffix').getOrElse('')
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                cppFlags '-std=c++17', '-Wall', '-Wextra'
            }
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseKeystoreFile)
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path = file('CMakeLists.txt')
            version = '3.22.1'
        }
    }

    buildFeatures {
        buildConfig = true
        prefab = true
        aidl = true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packaging {
        resources {
            merges += 'META-INF/xposed/*'
            merges += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        disable 'GradleDependency', 'ObsoleteSdkInt'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'io.github.vvb2060.ndk:dobby:1.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'org.apache.commons:commons-compress:1.28.0'

    compileOnly('io.github.libxposed:api:101.0.0') {
        transitive = false
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
